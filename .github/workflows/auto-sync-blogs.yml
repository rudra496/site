name: Auto-Sync Blog Hub & Counters

on:
  push:
    branches: [ main ]
    paths:
      - 'blog/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Blog Synchronization Engine
        run: |
          python3 sync_blogs.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No blog count or metadata changes detected."
          else
            git commit -m "chore(blog): auto-sync blog count, manifest & indices [skip ci]"
            git push
          fi
